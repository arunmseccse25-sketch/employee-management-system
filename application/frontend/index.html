<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <!-- Search Section -->
    <div class="search-section">

        <input
                type="text"
                id="searchInput"
                placeholder="Search employee by name"
        >

        <button onclick="searchEmployees()">
            Search
        </button>

        <button onclick="loadEmployees()">
            View All
        </button>

    </div>

    <!-- Employee Form -->
    <div class="form-container">

        <h2 id="formTitle">Add Employee</h2>

        <form id="employeeForm">

            <input
                    type="hidden"
                    id="employeeId"
            >

            <div class="form-group">

                <label>Name</label>

                <input
                        type="text"
                        id="name"
                        required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        id="email"
                        required
                >

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input
                        type="text"
                        id="phone"
                >

            </div>

            <div class="form-group">

                <label>Department</label>

                <input
                        type="text"
                        id="department"
                >

            </div>

            <div class="form-group">

                <label>Designation</label>

                <input
                        type="text"
                        id="designation"
                >

            </div>

            <div class="form-group">

                <label>Joining Date</label>

                <input
                        type="date"
                        id="joiningDate"
                >

            </div>

            <button type="submit" id="saveButton">
                Add Employee
            </button>

            <button
                    type="button"
                    id="cancelButton"
                    onclick="cancelEdit()"
                    style="display: none;"
            >
                Cancel
            </button>

        </form>

    </div>

    <!-- Message -->
    <div id="message"></div>

    <!-- Employee Table -->
    <div class="table-container">

        <h2>Employees</h2>

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Joining Date</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody id="employeeTableBody">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
